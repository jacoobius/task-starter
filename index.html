<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Task Starter</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Lets keyboard users jump straight past the header. -->
  <a class="skip-link" href="#main">Skip to main content</a>

  <header class="site-header">
    <p class="app-name">Task Starter</p>
  </header>

  <!--
    Invisible message area for screen readers. app.js writes short
    messages here ("Step added") and screen readers speak them.
  -->
  <p id="status" class="visually-hidden" role="status"></p>

  <!--
    The app has three screens. Only one is visible at a time.
    app.js shows a screen by removing its "hidden" attribute
    and adding "hidden" to the others.
  -->
  <main id="main">

    <!-- Screen 1: type the task you're avoiding -->
    <section id="screen-task" class="screen" aria-labelledby="heading-task">
      <h1 id="heading-task" tabindex="-1">What's one task you've been avoiding?</h1>

      <form id="task-form">
        <label for="task-input">Your task</label>
        <input type="text" id="task-input" autocomplete="off" maxlength="120"
               required aria-describedby="task-hint">
        <p id="task-hint" class="hint">Just one. It can be small.</p>
        <button type="submit" class="button button-primary">Next: break it down</button>
      </form>
    </section>

    <!-- Screen 2: break the task into small steps -->
    <section id="screen-steps" class="screen" aria-labelledby="heading-steps" hidden>
      <h1 id="heading-steps" tabindex="-1">Break it into small steps</h1>

      <p class="task-name">
        Task: <strong id="steps-task-name"></strong>
        <button type="button" id="change-task" class="button button-quiet">Change task</button>
      </p>

      <form id="step-form">
        <label for="step-input">Add a step</label>
        <div class="input-row">
          <input type="text" id="step-input" autocomplete="off" maxlength="120"
                 aria-describedby="step-hint">
          <button type="submit" class="button">Add step</button>
        </div>
        <p id="step-hint" class="hint">Keep each step small: something you could do in about 10 minutes.</p>
      </form>

      <!-- app.js builds this list from state.steps -->
      <ol id="step-list" class="step-list" aria-label="Steps"></ol>
    </section>

    <!-- Screen 3: countdown timer for one step (built in task 5) -->
    <section id="screen-timer" class="screen" aria-labelledby="heading-timer" hidden>
      <h1 id="heading-timer" tabindex="-1">Just this one step</h1>
    </section>

  </main>

  <script src="app.js"></script>
</body>
</html>
